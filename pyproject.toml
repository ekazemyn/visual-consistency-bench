[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-consistency"
version = "0.0.1"
description = "CPU-first research on consistency in generated images, videos, and 3D assets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "pandas>=2.2,<3",
    "pillow>=11,<13",
    "scikit-image>=0.25,<1",
    "scikit-learn>=1.6,<2",
    "matplotlib>=3.10,<4",
    "opencv-python-headless>=4.11,<5",
    "trimesh>=4.6,<6",
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
]

[project.scripts]
visual-consistency = "visual_consistency.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
